---
backend: pacman
pacman:
    num_retries: 3
    disable_download_timeout: true
    needed_only: true
update_db: false
update_system: false
skip_if_no_internet: true

operations:
  - remove:
      # live-medium-only packages, dropped from the installed system
      - archinstall
      - edk2-shell
      - memtest86+-efi
      - mkinitcpio-archiso
      - syslinux
