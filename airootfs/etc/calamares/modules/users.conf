---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - video
    - audio
    - storage
    - optical
    - network
    - rfkill
    - lp
    - scanner

# --- no sudo configuration, by request ---------------------------------
# `sudoersGroup` is intentionally left unset. When it is set, Calamares
# writes /etc/sudoers.d/10-installer granting that group full sudo rights.
# With it omitted, no sudoers drop-in is created and the new user is NOT
# put in wheel, so `sudo` stays installed but completely unconfigured.
# Administration is done by logging in as root (`su -`).
# To turn normal sudo back on later, uncomment the next line and add
# "wheel" to defaultGroups above, then re-run the installer.
# sudoersGroup: wheel
# sudoersConfigureWithGroup: false

setRootPassword:    true
doAutologin:        false
doReusePassword:    false

availableShells: /bin/bash, /bin/zsh

passwordRequirements:
    nonempty: true
    minLength: 6
    libpwquality:
        - minlen=6
        - minclass=0
