---
dontChroot: false
timeout: 60
script:
    # Strip every live-only privilege shortcut out of the installed system.
    - "rm -f /etc/polkit-1/rules.d/49-calamares.rules"
    - "rm -f /etc/sddm.conf.d/autologin.conf"
    - "rm -f /etc/systemd/system/live-setup.service"
    - "rm -f /etc/systemd/system/multi-user.target.wants/live-setup.service"
    - "rm -f /usr/local/bin/live-setup"
    - "rm -f /usr/local/bin/install-system"
    - "rm -f /etc/skel/Desktop/install-system.desktop"
    - "rm -rf /root/Desktop"
    # Belt and braces: make sure no sudoers drop-in survived.
    - "rm -f /etc/sudoers.d/10-installer"
    - "rm -f /etc/sudoers.d/g_wheel"
    # Lock the root account behind the password Calamares just set, and make
    # sure it is not empty.
    - "passwd -u root || true"
