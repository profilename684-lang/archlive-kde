[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Local repo holding AUR packages you build yourself (calamares lives here).
# See README.md, step 1. Remove this block if you point calamares elsewhere.
[custom]
SigLevel = Optional TrustAll
Server = file:///repo
